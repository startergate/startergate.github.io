work\",\"team\":{\"name\":\"FETCHING\",\"link\":\"https://github.com/Fetching-Korea\"},\"status\":\"done\",\"startedAt\":\"2020-12-31\",\"finishedAt\":\"2026-03-31\",\"types\":[\"Front-end\",\"Back-end\"],\"techs\":[\"TypeScript\",\"Node.js\",\"Next.js\",\"Nest.js\",\"MySQL\",\"Aurora MySQL\",\"AWS ECS\"],\"collaborators\":[{\"name\":\"최호승\",\"roles\":[{\"ko\":\"개발\",\"en\":\"Development\"}]}],\"contents\":[{\"title\":{\"ko\":\"개요\",\"en\":\"Overview\"},\"text\":{\"ko\":\"페칭에 근무하며 개발한 어드민 시스템입니다. 이전 어드민부터 시작해서 현재 사용되고 있는 어드민을 새로 개발하는 것에도 참여했으며, 주로 백엔드 작업을 진행했고 프로젝트가 어느 정도 완성되고 난 뒤로는 프론트엔드 작업도 직접 진행했습니다.\",\"en\":\"This is the admin system I developed while working at Fetching. I worked on the previous admin and was also involved in developing the one currently in use — mainly on the backend, and once the project was mostly complete, I worked on the frontend myself as well.\"}},{\"title\":{\"ko\":\"커머스 관리\",\"en\":\"Commerce Management\"},\"text\":{\"ko\":\"사내에서 구현한 커머스에서 발생한 주문, 취소, 외부 PG사 연동과 같은 결제 시스템과 기획전, 이벤트과 같은 컨텐츠 시스템을 개발하고 운영했습니다. 최초 개발 시점부터 참여했으며 배포 파이프라인 구축과 같은 배포 과정에도 깊이 참여했습니다.\",\"en\":\"I built and operated the payment system for orders and cancellations from our in-house commerce platform — including integrations with external PG (payment gateway) providers — as well as content systems like curated collections and promotional events. I was involved from the very first development phase, and was also deeply involved in the deployment process, including building the deployment pipeline.\"}},{\"title\":{\"ko\":\"상품 수집 시스템 관리\",\"en\":\"Product Collection System Management\"},\"text\":{\"ko\":\"페칭에서 상품을 수집하는데 사용하는 크롤러, 피드 수집기의 실행 상황을 모니터링하고 크롤링 대상 우선순위 조정  등의 통제를 어드민 상에서 비개발자도 할 수 있도록 하는 시스템을 백엔드와 프론트엔드를 모두 개발하고 운영했습니다. AWS API와 연동하거나, 로컬 서버와 통신하는 등의 과정을 통해서 높은 수준의 관리가 가능한 시스템으로 만들 수 있었습니다.\",\"en\":\"I built and operated both the backend and frontend of a system that lets even non-developers — not just developers — monitor the status of the crawlers and feed collectors Fetching uses to gather products, and control things like crawling-target priority, all from the admin itself. Integrating with the AWS API and communicating with local servers let me build a system capable of a high level of management.\"}},{\"title\":{\"ko\":\"권한 시스템\",\"en\":\"Permission System\"},\"text\":{\"ko\":\"어드민에서 수행 가능한 행동을 기반으로 한 권한을 사용자에게 부여/박탈하고, 사용자에게 부여된 권한을 검사하는 시스템을 개발했습니다\",\"en\":\"I built a system that grants or revokes user permissions based on the actions available in the admin, and checks the permissions each user has been granted.\"}}],\"highlight\":{\"backend\":1}},{\"id\":\"fetching-commerce\",\"name\":\"FETCHING Commerce\",\"description\":{\"ko\":\"페칭 커머스 서비스\",\"en\":\"FETCHING commerce service\"},\"category\":\"work\",\"team\":{\"name\":\"FETCHING\",\"link\":\"https://github.com/Fetching-Korea\"},\"status\":\"done\",\"startedAt\":\"2021-08-23\",\"finishedAt\":\"2026-03-31\",\"types\":[\"Full-stack\"],\"techs\":[\"TypeScript\",\"Node.js\",\"Next.js\",\"Nest.js\",\"MySQL\",\"Aurora MySQL\",\"AWS ECS\"],\"collaborators\":[{\"name\":\"최호승\",\"roles\":[{\"ko\":\"개발\",\"en\":\"Development\"}]}],\"highlight\":{\"backend\":2}},{\"id\":\"dotori\",\"name\":\"DOTORI\",\"description\":{\"ko\":\"GSM 기숙사 관리 시스템\",\"en\":\"GSM dormitory management system\"},\"category\":\"team\",\"team\":{\"name\":\"빈실\",\"link\":\"https://github.com/BeanSil-Archive2\"},\"status\":\"canceled\",\"startedAt\":\"2020-02-14\",\"finishedAt\":\"2020-08-26\",\"types\":[\"Back-end\"],\"techs\":[\"TypeScript\",\"Node.js\",\"Koa.js\",\"MariaDB\",\"AWS EC2\"],\"collaborators\":[{\"name\":\"최호승\",\"roles\":[{\"ko\":\"팀장\",\"en\":\"Team Lead\"},{\"ko\":\"서버 개발 리드\",\"en\":\"Back-end Development Lead\"}]},{\"name\":\"박준영\",\"roles\":[{\"ko\":\"서버 개발\",\"en\":\"Back-end Development\"}]},{\"name\":\"최연진\",\"roles\":[{\"ko\":\"서버 개발\",\"en\":\"Back-end Development\"}]},{\"name\":\"정현문\",\"roles\":[{\"ko\":\"서버 개발\",\"en\":\"Back-end Development\"}]},{\"name\":\"권희준\",\"roles\":[{\"ko\":\"프론트 개발 리드\",\"en\":\"Front-end Development Lead\"}]},{\"name\":\"김아련\",\"roles\":[{\"ko\":\"프론트 개발\",\"en\":\"Front-end Development\"}]},{\"name\":\"안채웅\",\"roles\":[{\"ko\":\"프론트 개발\",\"en\":\"Front-end Development\"}]},{\"name\":\"이진혁\",\"roles\":[{\"ko\":\"프론트 개발\",\"en\":\"Front-end Development\"}]}],\"logo\":{\"src\":\"projects/dotori/logo.png\",\"isTitle\":true},\"images\":[{\"src\":\"projects/dotori/1.png\",\"description\":{\"ko\":\"DOTORI 메인 화면\",\"en\":\"DOTORI main screen\"}}],\"links\":[{\"type\":\"GitHub\",\"link\":\"https://github.com/BeanSil-Archive2/DOTORI-api\",\"label\":\"BeanSil-Archive2/DOTORI-api\"},{\"type\":\"GitHub\",\"link\":\"https://github.com/GwonHeeJun/Dotori-Client\",\"label\":\"GwonHeeJun/Dotori-Client\"},{\"type\":\"GitHub\",\"link\":\"https://github.com/BeanSil-Archive2/commit-convention-checker\",\"label\":\"BeanSil-Archive2/commit-convention-checker\"},{\"type\":\"GitHub\",\"link\":\"https://github.com/BeanSil-Archive2/git-flow-automation\",\"label\":\"BeanSil-Archive2/git-flow-automation\"},{\"type\":\"GitHub\",\"link\":\"https://github.com/BeanSil-Archive2/Bean-Account\",\"label\":\"BeanSil-Archive2/Bean-Account\"}],\"contents\":[{\"title\":{\"ko\":\"What is DOTORI?\"},\"ref\":\"markdowns/what-is-dotori.md\"},{\"title\":{\"ko\":\"처음 해보는 것 투성이\"},\"text\":{\"ko\":\"DOTORI는 새롭게 시도해보는 것이 정말 많은 프로젝트였다. 유닛 테스트, 문서화, GitHub Action 등 여러 DevOps 들을 도입해봤고, redis, prettier같은 기술을 사용했다. 백엔드 5명, 프론트엔드 6명과 함께하는 프로젝트였고, 많은 협업 인원을 관리하기 위해 스프린트와 git flow를 사용했다. 비록 학교의 동아리 제도 변경으로 인해 프로젝트가 미완성으로 끝나긴 했지만, 지금까지 했던 프로젝트들 중에서 가장 많은걸 배운 프로젝트였다.\"}},{\"title\":{\"ko\":\"Write and Go\"},\"text\":{\"ko\":\"DOTORI는 내가 문서화와 테스팅을 처음으로 시도해본 프로젝트이다. 문서화는 OpenAPI 3.0을 따랐고, 테스팅 라이브러리로는 Jest를 사용했다. 둘을 사용하면서 느낀 가장 큰 장점은 일단 개발 기간을 엄청나게 줄여주고, 혼동을 방지한다는 점에 있다고 생각한다. 문서화를 통해서 프론트의 질문을 훨씬 덜 받게 되었고, 테스팅을 통해서 평소라면 찾지 못했을 버그를 찾아내거나 엔드포인트의 개발 효율을 향상시킬수 있었다. 프로젝트의 백엔드 개발이 후반부로 들어간 시점부터는 테스팅을 의무화하여 커버리지를 100%로 향상시킬 수 있었다.\"},\"image\":\"projects/dotori/2.png\"}],\"highlight\":{\"backend\":3}},{\"id\":\"eliverd\",\"name\":\"Eliverd\",\"description\":{\"ko\":\"Deliver Your Life, Eliverd. 모두를 위한 배달 서비스\",\"en\":\"Deliver Your Life, Eliverd. A delivery service for everyone\"},\"category\":\"team\",\"status\":\"done\",\"startedAt\":\"2020-04-24\",\"finishedAt\":\"2020-10-18\",\"types\":[\"Back-end\"],\"techs\":[\"Python\",\"Django\",\"MySQL\",\"Docker\",\"AWS EC2\",\"AWS S3\"],\"collaborators\":[{\"name\":\"최호승\",\"roles\":[{\"ko\":\"팀장\",\"en\":\"Team Lead\"},{\"ko\":\"기획\",\"en\":\"Planning\"},{\"ko\":\"서버 개발\",\"en\":\"Back-end Development\"}]},{\"name\":\"박준영\",\"roles\":[{\"ko\":\"디자인\",\"en\":\"Design\"},{\"ko\":\"모바일 앱 개발\",\"en\":\"Mobile App Development\"}]},{\"name\":\"박종효\",\"roles\":[{\"ko\":\"데스크탑 앱 개발\",\"en\":\"Desktop App Development\"}]}],\"logo\":{\"src\":\"projects/eliverd/logo.png\"},\"images\":[{\"src\":\"projects/eliverd/customer/1.gif\",\"description\":{\"ko\":\"소비자 앱 상품 조회\",\"en\":\"Consumer app: product listing\"}},{\"src\":\"projects/eliverd/customer/2.gif\",\"description\":{\"ko\":\"소비자 앱 주문\",\"en\":\"Consumer app: ordering\"}},{\"src\":\"projects/eliverd/customer/3.gif\",\"description\":{\"ko\":\"소비자 앱 결제\",\"en\":\"Consumer app: payment\"}},{\"src\":\"projects/eliverd/customer/4.gif\",\"description\":{\"ko\":\"소비자 앱 주문 내역 조회\",\"en\":\"Consumer app: order history\"}},{\"src\":\"projects/eliverd/customer/5.gif\",\"description\":{\"ko\":\"소비자 앱 상품 추천\",\"en\":\"Consumer app: product recommendations\"}},{\"src\":\"projects/eliverd/customer/6.gif\",\"description\":{\"ko\":\"소비자 앱 검색\",\"en\":\"Consumer app: search\"}},{\"src\":\"projects/eliverd/customer/7.gif\",\"description\":{\"ko\":\"소비자 앱 카테고리 분류\",\"en\":\"Consumer app: category browsing\"}},{\"src\":\"projects/eliverd/customer/8.gif\",\"description\":{\"ko\":\"소비자 앱 마이페이지\",\"en\":\"Consumer app: my page\"}},{\"src\":\"projects/eliverd/store/1.gif\",\"description\":{\"ko\":\"상점 앱 상품 조회\",\"en\":\"Merchant app: product listing\"}},{\"src\":\"projects/eliverd/store/2.gif\",\"description\":{\"ko\":\"상점 앱 주문\",\"en\":\"Merchant app: ordering\"}},{\"src\":\"projects/eliverd/store/3.gif\",\"description\":{\"ko\":\"상점 앱 결제\",\"en\":\"Merchant app: payment\"}},{\"src\":\"projects/eliverd/store/4.gif\",\"description\":{\"ko\":\"상점 앱 주문 내역 조회\",\"en\":\"Merchant app: order history\"}},{\"src\":\"projects/eliverd/store/5.gif\",\"description\":{\"ko\":\"상점 앱 상품 추천\",\"en\":\"Merchant app: product recommendations\"}},{\"src\":\"projects/eliverd/store/6.gif\",\"description\":{\"ko\":\"상점 앱 검색\",\"en\":\"Merchant app: search\"}}],\"links\":[{\"type\":\"GitHub\",\"link\":\"https://github.com/Junyeong-Market\",\"label\":\"Junyeong-Market\"},{\"type\":\"GitHub\",\"link\":\"https://github.com/Junyeong-Market/Eliverd-API\",\"label\":\"Junyeong-Market/Eliverd-API\"},{\"type\":\"GitHub\",\"link\":\"https://github.com/Junyeong-Market/eliverd_customer\",\"label\":\"Junyeong-Market/eliverd_customer\"},{\"type\":\"GitHub\",\"link\":\"https://github.com/Junyeong-Market/eliverd_store\",\"label\":\"Junyeong-Market/eliverd_store\"},{\"type\":\"GitHub\",\"link\":\"https://github.com/Junyeong-Market/eliverd_pos\",\"label\":\"Junyeong-Market/eliverd_pos\"},{\"type\":\"GitHub\",\"link\":\"https://github.com/Junyeong-Market/Eliverd-API-Deploy\",\"label\":\"Junyeong-Market/Eliverd-API-Deploy\"},{\"type\":\"GitHub\",\"link\":\"https://github.com/Junyeong-Market/KP-TEST\",\"label\":\"Junyeong-Market/KP-TEST\"}],\"contents\":[{\"title\":{\"ko\":\"What is Eliverd?\"},\"ref\":\"markdowns/what-is-eliverd.md\"},{\"title\":{\"ko\":\"구상\"},\"text\":{\"ko\":\"Eliverd는 소상공인 드론 배달 서비스라는 아이디어로 시작했다. 2018년 E-Faucet 프로젝트를 마치고 다른 대회에서 해볼만한 아이디어를 구상하던 과정의 일환이었다. 구상을 계속 할수록 규모가 계속 커져갔고, 다른 중요한 프로젝트들도 있었기에 다른 사람과 같이 팀 프로젝트로 진행하기로 구상했다.\"}},{\"title\":{\"ko\":\"처음 해보는 규모\"},\"text\":{\"ko\":\"Eliverd는 클라이언트 3개로 구성된 프로젝트다. 각 클라이언트는 개별의 기능을 가지고, API 서버는 하나를 사용한다. 또 기능도 재고 관리, 쇼핑몰, 추천, 주문, 결제, 배송 등을 모두 다뤄야했기에 규모가 크고 복잡해졌다. 이를 잘 해결하기 위해서 무엇이 필수적인지, 무엇을 먼저 해야하는지, 무엇을 없앨수 있는지를 생각했다. 기능이 추가로 생기거나 다른 엔드포인트가 필요해지더라도 기존 리소스를 사용할수 있도록 구상했다. 또한 문서화를 통해서 소통이 늦어지는 문제를 방지할 수 있었다. 이를 통해 프로젝트를 시작할 때 구상했던 기능을 거의 대부분 구현할 수 있었다.\"}},{\"title\":{\"ko\":\"실무적 설계\"},\"text\":{\"ko\":\"Eliverd는 졸업 팀 프로젝트로 진행하는 거 였지만 시스템 설계나 기능은 실제 서비스를 목적으로 만들었다. 물론 실무의 수준에는 미치지 못하지만 컨테이너화나 문서화, 그리고 확장성을 어느 정도 고려해서 설계했다. 데이터베이스는 각 상점마다 주문을 따로 전달해주는 비즈니스 로직에 맞춰서 설계되었으며, 카카오페이와 연동하여 실제 사용자의 경험에 가깝게 구현할 수 있도록 노력했다.\"}},{\"title\":{\"ko\":\"'그' 바이러스\"},\"text\":{\"ko\":\"원래라면 학교에서 만나서 회의하며 진행했어야 하는 프로젝트였지만, 코로나 19 때문에 온라인으로만 협업을 진행해야 했다. 회의와 의사 소통은 Discord로 진행하고, 코드 협업은 GitHub Issue를 활용했다. 이 때 온라인으로 많은 부분을 정해둘 수 있었기에 등교 개학 후에도 빠르게 개발할 수 있었다.\"}}],\"highlight\":{\"backend\":4}}],\"game\":[{\"id\":\"lost\",\"name\":\"Lost\",\"description\":{\"ko\":\"2D 플랫포머 게임\",\"en\":\"2D platformer game\"},\"category\":\"team\",\"team\":{\"name\":\"Tiny Beluga\",\"link\":\"https://tiny-beluga.github.io\"},\"status\":\"done\",\"startedAt\":\"2019-03-08\",\"finishedAt\":\"2020-08-06\",\"types\":[\"Game\"],\"techs\":[\"C#\",\"Unity\",\"Steamworks\"],\"collaborators\":[{\"name\":\"최호승\",\"roles\":[{\"ko\":\"팀장\",\"en\":\"Team Lead\"},{\"ko\":\"기획\",\"en\":\"Planning\"},{\"ko\":\"게임 개발\",\"en\":\"Game Development\"}]},{\"name\":\"박종효\",\"roles\":[{\"ko\":\"게임 개발\",\"en\":\"Game Development\"}]},{\"name\":\"정상현\",\"roles\":[{\"ko\":\"게임 개발\",\"en\":\"Game Development\"}]},{\"name\":\"박재홍\",\"roles\":[{\"ko\":\"QA\",\"en\":\"QA\"}]},{\"name\":\"오영빈\",\"roles\":[{\"ko\":\"작곡\",\"en\":\"Composition\"}]},{\"name\":\"Claude Code\",\"roles\":[{\"ko\":\"일부 구현\",\"en\":\"Partial Implementation\"}]}],\"logo\":{\"src\":\"projects/lost.png\"},\"links\":[{\"type\":\"Steam\",\"link\":\"https://store.steampowered.com/app/1095360/Lost/\",\"label\":\"Lost\"},{\"type\":\"GitHub\",\"link\":\"https://github.com/tiny-beluga/Lost-Issue-Tracker\",\"label\":\"tiny-beluga/Lost-Issue-Tracker\"}],\"highlight\":{\"game\":1}},{\"id\":\"basterds\",\"name\":\"Basterds: Hair Naked\",\"description\":{\"ko\":\"타워 디펜스 게임\",\"en\":\"Tower defense game\"},\"category\":\"team\",\"status\":\"done\",\"startedAt\":\"2019-12-18\",\"finishedAt\":\"2020-01-08\",\"types\":[\"Game\",\"Back-end\"],\"techs\":[\"Python\",\"TypeScript\",\"C++\",\"Node.js\",\"Django\",\"Koa.js\",\"Unreal Engine\",\"MySQL\",\"AWS EC2\"],\"collaborators\":[{\"name\":\"최호승\",\"roles\":[{\"ko\":\"팀장\",\"en\":\"Team Lead\"},{\"ko\":\"기획\",\"en\":\"Planning\"},{\"ko\":\"서버 개발\",\"en\":\"Back-end Development\"},{\"ko\":\"게임 네트워킹\",\"en\":\"Game Networking\"}]},{\"name\":\"정민우\",\"roles\":[{\"ko\":\"디자인\",\"en\":\"Design\"},{\"ko\":\"프론트 개발\",\"en\":\"Front-end Development\"}]},{\"name\":\"최준혁\",\"roles\":[{\"ko\":\"게임 개발\",\"en\":\"Game Development\"}]}],\"links\":[{\"type\":\"GitHub\",\"link\":\"https://github.com/Jeong-Mw/Basterds_app\",\"label\":\"Jeong-Mw/Basterds_app\"},{\"type\":\"GitHub\",\"link\":\"https://github.com/startergate/Basterds-Game-Server\",\"label\":\"Basterds-Game-Server\"},{\"type\":\"GitHub\",\"link\":\"https://github.com/startergate/Basterds-Stat-Server\",\"label\":\"Basterds-Stat-Server\"},{\"type\":\"GitHub\",\"link\":\"https://github.com/startergate/Basterds-Stat-Client\",\"label\":\"Basterds-Stat-Client\"}],\"highlight\":{\"game\":2}},{\"id\":\"dont-afraid\",\"name\":\"Don't Afraid\",\"description\":{\"ko\":\"트라우마 치료 게임\",\"en\":\"Trauma therapy game\"},\"category\":\"team\",\"status\":\"done\",\"startedAt\":\"2018-08-07\",\"finishedAt\":\"2018-08-08\",\"types\":[\"Native Application\",\"Game\"],\"techs\":[\"C#\",\"JavaScript\",\"Node.js\",\"Unity\",\"Electron\"],\"collaborators\":[{\"name\":\"최호승\",\"roles\":[{\"ko\":\"게임 개발\",\"en\":\"Game Development\"},{\"ko\":\"게임 런처 개발\",\"en\":\"Game Launcher Development\"}]},{\"name\":\"김건\",\"roles\":[{\"ko\":\"개발\",\"en\":\"Development\"}]},{\"name\":\"김혜연\",\"roles\":[{\"ko\":\"개발\",\"en\":\"Development\"}]},{\"name\":\"nightgrow\",\"roles\":[{\"ko\":\"개발\",\"en\":\"Development\"}]}],\"logo\":{\"src\":\"projects/dontafraid.png\"},\"links\":[{\"type\":\"GitHub\",\"link\":\"https://github.com/Co-Hackaton-2018-8-1\",\"label\":\"Co-Hackaton-2018-8-1\"},{\"type\":\"GitHub\",\"link\":\"https://github.com/Co-Hackaton-2018-8-1/DontAfraid\",\"label\":\"Co-Hackaton-2018-8-1/DontAfraid\"}],\"highlight\":{\"game\":3}}]},\"overviews\":{\"fetching-admin\":{\"overview\":\"This is the admin system I developed while working at Fetching. I worked on the previous admin and was also involved in developing the one currently in use — mainly on the backend, and once the project was mostly complete, I worked on the frontend myself as well.\",\"sections\":[{\"no\":\"01\",\"title\":\"Commerce Management\",\"body\":\"I built and operated the payment system for orders and cancellations from our in-house commerce platform — including integrations with external PG (payment gateway) providers — as well as content systems like curated collections and promotional events. I was involved from the very first development phase, and was also deeply involved in the deployment process, including building the deployment pipeline.\",\"image\":\"$undefined\"},{\"no\":\"02\",\"title\":\"Product Collection System Management\",\"body\":\"I built and operated both the backend and frontend of a system that lets even non-developers — not just developers — monitor the status of the crawlers and feed collectors Fetching uses to gather products, and control things like crawling-target priority, all from the admin itself. Integrating with the AWS API and communicating with local servers let me build a system capable of a high level of management.\",\"image\":\"$undefined\"},{\"no\":\"03\",\"title\":\"Permission System\",\"body\":\"I built a system that grants or revokes user permissions based on the actions available in the admin, and checks the permissions each user has been granted.\",\"image\":\"$undefined\"}]},\"fetching-commerce\":{\"overview\":\"FETCHING commerce service\",\"sections\":[]},\"dotori\":{\"overview\":\"DOTORI는 광주소프트웨어마이스터고등학교 기숙사 관리 및 교내 커뮤니티 역할를 위한 소프트웨어이다. 노트북 예약, 기상음악 신청, 호실 변경 신청 층의 기능을 제공했다. 동아리 빈실의 프로젝트이다.\",\"sections\":[{\"no\":\"01\",\"title\":\"처음 해보는 것 투성이\",\"body\":\"DOTORI는 새롭게 시도해보는 것이 정말 많은 프로젝트였다. 유닛 테스트, 문서화, GitHub Action 등 여러 DevOps 들을 도입해봤고, redis, prettier같은 기술을 사용했다. 백엔드 5명, 프론트엔드 6명과 함께하는 프로젝트였고, 많은 협업 인원을 관리하기 위해 스프린트와 git flow를 사용했다. 비록 학교의 동아리 제도 변경으로 인해 프로젝트가 미완성으로 끝나긴 했지만, 지금까지 했던 프로젝트들 중에서 가장 많은걸 배운 프로젝트였다.\",\"image\":\"$undefined\"},{\"no\":\"02\",\"title\":\"Write and Go\",\"body\":\"DOTORI는 내가 문서화와 테스팅을 처음으로 시도해본 프로젝트이다. 문서화는 OpenAPI 3.0을 따랐고, 테스팅 라이브러리로는 Jest를 사용했다. 둘을 사용하면서 느낀 가장 큰 장점은 일단 개발 기간을 엄청나게 줄여주고, 혼동을 방지한다는 점에 있다고 생각한다. 문서화를 통해서 프론트의 질문을 훨씬 덜 받게 되었고, 테스팅을 통해서 평소라면 찾지 못했을 버그를 찾아내거나 엔드포인트의 개발 효율을 향상시킬수 있었다. 프로젝트의 백엔드 개발이 후반부로 들어간 시점부터는 테스팅을 의무화하여 커버리지를 100%로 향상시킬 수 있었다.\",\"image\":\"projects/dotori/2.png\"}]},\"eliverd\":{\"overview\":\"Eliverd는 상점 관리 \u0026 배달 서비스다. 상품 재고 관리, 온라인 몰 운영, 주문, 배달까지 모두 처리해준다. 온라인 판매나 배달 서비스를 모든 소상공인이 사용할 수 있게 하는 것을 목표로 개발했다. 2020년 GSM 졸업 프로젝트였고, 장려상을 수상했다.\",\"sections\":[{\"no\":\"01\",\"title\":\"구상\",\"body\":\"Eliverd는 소상공인 드론 배달 서비스라는 아이디어로 시작했다. 2018년 E-Faucet 프로젝트를 마치고 다른 대회에서 해볼만한 아이디어를 구상하던 과정의 일환이었다. 구상을 계속 할수록 규모가 계속 커져갔고, 다른 중요한 프로젝트들도 있었기에 다른 사람과 같이 팀 프로젝트로 진행하기로 구상했다.\",\"image\":\"$undefined\"},{\"no\":\"02\",\"title\":\"처음 해보는 규모\",\"body\":\"Eliverd는 클라이언트 3개로 구성된 프로젝트다. 각 클라이언트는 개별의 기능을 가지고, API 서버는 하나를 사용한다. 또 기능도 재고 관리, 쇼핑몰, 추천, 주문, 결제, 배송 등을 모두 다뤄야했기에 규모가 크고 복잡해졌다. 이를 잘 해결하기 위해서 무엇이 필수적인지, 무엇을 먼저 해야하는지, 무엇을 없앨수 있는지를 생각했다. 기능이 추가로 생기거나 다른 엔드포인트가 필요해지더라도 기존 리소스를 사용할수 있도록 구상했다. 또한 문서화를 통해서 소통이 늦어지는 문제를 방지할 수 있었다. 이를 통해 프로젝트를 시작할 때 구상했던 기능을 거의 대부분 구현할 수 있었다.\",\"image\":\"$undefined\"},{\"no\":\"03\",\"title\":\"실무적 설계\",\"body\":\"Eliverd는 졸업 팀 프로젝트로 진행하는 거 였지만 시스템 설계나 기능은 실제 서비스를 목적으로 만들었다. 물론 실무의 수준에는 미치지 못하지만 컨테이너화나 문서화, 그리고 확장성을 어느 정도 고려해서 설계했다. 데이터베이스는 각 상점마다 주문을 따로 전달해주는 비즈니스 로직에 맞춰서 설계되었으며, 카카오페이와 연동하여 실제 사용자의 경험에 가깝게 구현할 수 있도록 노력했다.\",\"image\":\"$undefined\"},{\"no\":\"04\",\"title\":\"'그' 바이러스\",\"body\":\"원래라면 학교에서 만나서 회의하며 진행했어야 하는 프로젝트였지만, 코로나 19 때문에 온라인으로만 협업을 진행해야 했다. 회의와 의사 소통은 Discord로 진행하고, 코드 협업은 GitHub Issue를 활용했다. 이 때 온라인으로 많은 부분을 정해둘 수 있었기에 등교 개학 후에도 빠르게 개발할 수 있었다.\",\"image\":\"$undefined\"}]},\"lost\":{\"overview\":\"2D platformer game\",\"sections\":[]},\"basterds\":{\"overview\":\"Tower defense game\",\"sections\":[]},\"dont-afraid\":{\"overview\":\"Trauma therapy game\",\"sections\":[]}},\"techs\":[{\"name\":\"TypeScript\",\"mode\":\"backend\",\"level\":\"using\",\"logo\":{\"src\":\"langs/typescript.png\",\"background\":\"#4178BA\",\"padding\":2}},{\"name\":\"JavaScript\",\"mode\":\"backend\",\"level\":\"using\",\"logo\":{\"src\":\"langs/javascript.png\",\"background\":\"#f4de50\",\"padding\":2}},{\"name\":\"Node.js\",\"mode\":\"backend\",\"level\":\"using\",\"logo\":{\"src\":\"langs/nodejs.svg\",\"background\":\"#FFFFFF\",\"padding\":2}},{\"name\":\"Python\",\"mode\":\"all\",\"level\":\"learned\",\"logo\":{\"src\":\"langs/python.png\"}},{\"name\":\"C\",\"mode\":\"all\",\"level\":\"learned\",\"logo\":{\"src\":\"langs/c.webp\"}},{\"name\":\"C++\",\"mode\":\"all\",\"level\":\"learned\",\"logo\":{\"src\":\"langs/cpp.png\"}},{\"name\":\"C#\",\"mode\":\"all\",\"level\":\"learned\",\"logo\":{\"src\":\"langs/csharp.png\"}},{\"name\":\"Java\",\"mode\":\"all\",\"level\":\"learned\",\"logo\":{\"src\":\"langs/java.png\"}},{\"name\":\"PHP\",\"mode\":\"backend\",\"level\":\"learned\",\"logo\":{\"src\":\"langs/php.png\",\"background\":\"#6e6ea7\"}},{\"name\":\"Go\",\"mode\":\"all\",\"level\":\"learning\",\"logo\":{\"src\":\"langs/go.png\",\"background\":\"#00ADD8\",\"padding\":4}},{\"name\":\"NestJS\",\"mode\":\"backend\",\"level\":\"using\",\"logo\":{\"src\":\"langs/nestjs.svg\",\"background\":\"#1A1A1A\"}},{\"name\":\"React\",\"mode\":\"backend\",\"level\":\"using\",\"logo\":{\"src\":\"langs/react.png\",\"background\":\"#1F1F1F\",\"padding\":2}},{\"name\":\"Express.js\",\"mode\":\"backend\",\"level\":\"learned\",\"logo\":{\"src\":\"langs/expressjs.png\",\"background\":\"#FFFFFF\"}},{\"name\":\"Koa.js\",\"mode\":\"backend\",\"level\":\"learned\",\"logo\":{\"src\":\"langs/koajs.png\",\"background\":\"#FFFFFF\"}},{\"name\":\"Django\",\"mode\":\"backend\",\"level\":\"learned\",\"logo\":{\"src\":\"langs/django.png\",\"background\":\"#092E20\"}},{\"name\":\"Django REST Framework\",\"mode\":\"backend\",\"level\":\"learned\",\"logo\":{\"src\":\"langs/drf.png\"}},{\"name\":\"Unity\",\"mode\":\"game\",\"level\":\"using\",\"logo\":{\"src\":\"langs/unity.png\",\"background\":\"black\"}},{\"name\":\"Unreal Engine\",\"mode\":\"game\",\"level\":\"learned\",\"logo\":{\"src\":\"langs/unrealengine.png\",\"background\":\"black\"}},{\"name\":\"Qt\",\"mode\":\"all\",\"level\":\"learned\",\"logo\":{\"src\":\"langs/qt.png\",\"padding\":2}},{\"name\":\"jQuery\",\"mode\":\"backend\",\"level\":\"learned\",\"logo\":{\"src\":\"langs/jquery.png\"}},{\"name\":\"Gatsby\",\"mode\":\"all\",\"level\":\"learning\",\"logo\":{\"src\":\"langs/gatsby.png\",\"background\":\"#663399\"}},{\"name\":\"Spring\",\"mode\":\"backend\",\"level\":\"learning\",\"logo\":{\"src\":\"langs/spring.png\"}},{\"name\":\"MySQL\",\"mode\":\"backend\",\"level\":\"using\",\"logo\":{\"src\":\"langs/mysql.png\",\"padding\":3}},{\"name\":\"MariaDB\",\"mode\":\"backend\",\"level\":\"using\",\"logo\":{\"src\":\"langs/mariadb.png\",\"padding\":4}},{\"name\":\"AuroraDB\",\"mode\":\"backend\",\"level\":\"using\",\"logo\":{\"src\":\"langs/auroradb.png\",\"cover\":true}},{\"name\":\"Redis\",\"mode\":\"backend\",\"level\":\"using\",\"logo\":{\"src\":\"langs/redis.png\",\"padding\":3}},{\"name\":\"RabbitMQ\",\"mode\":\"backend\",\"level\":\"using\",\"logo\":{\"src\":\"langs/rabbitmq.svg\",\"background\":\"#FFFFFF\",\"padding\":5}},{\"name\":\"Elasticsearch\",\"mode\":\"backend\",\"level\":\"using\",\"logo\":{\"src\":\"langs/elasticsearch.svg\",\"background\":\"#FFFFFF\",\"padding\":3}},{\"name\":\"AWS\",\"mode\":\"backend\",\"level\":\"using\",\"logo\":{\"src\":\"langs/aws.svg\",\"background\":\"#FFFFFF\",\"padding\":3}},{\"name\":\"MongoDB\",\"mode\":\"backend\",\"level\":\"learned\",\"logo\":{\"src\":\"langs/mongodb.png\",\"background\":\"#21313C\",\"padding\":5}},{\"name\":\"Docker\",\"mode\":\"all\",\"level\":\"using\",\"logo\":{\"src\":\"externals/docker.png\",\"background\":\"#0db7ed\",\"padding\":5}},{\"name\":\"Jest\",\"mode\":\"all\",\"level\":\"learned\",\"logo\":{\"src\":\"langs/jest.png\",\"background\":\"#37383B\"}}],\"experiences\":[{\"company\":{\"ko\":\"FETCHING\"},\"companyLogo\":{\"src\":\"teams/fetching_white.svg\",\"srcOnLight\":\"teams/fetching.svg\",\"padding\":12},\"title\":{\"ko\":\"백엔드 엔지니어\",\"en\":\"Back-end Engineer\"},\"startedAt\":\"2020-12\",\"finishedAt\":\"2026-03\",\"location\":{\"ko\":\"서울특별시 성동구\",\"en\":\"Seongdong-gu, Seoul\"},\"link\":\"https://fetching.co.kr\",\"summary\":{\"ko\":\"MAU 75만명을 처리하는 백엔드 서버, 일 500만건 규모의 크롤링 시스템, 주문 및 커머스 컨텐츠 관리부터 회계 시스템을 포함한 다양한 기능의 어드민과 이를 운영하는 인프라와 사내 네트워크 관리까지 다양한 업무를 경험했습니다.\",\"en\":\"I've worked across a wide range of systems — from building and operating a backend server supporting 750K MAU, to a crawling system handling 5 million records a day, to an admin covering everything from orders and commerce content management to accounting, as well as the infrastructure and internal network that run it all.\"},\"detail\":{\"ko\":\"사내 어드민, 커머스, 상품 수집 시스템 등 회사의 모든 프로덕트 개발에 참여하였고, 몇몇 프로젝트는 초기부터 담당하여 전체적인 아키텍처까지 직접 설계하고 구축했습니다.\\n\\n개발한 프로덕트의 운영에도 모두 참여했으며, 비용이 제한된 환경에서 효율적이고 안정적으로 데이터베이스를 운영하고, 자동 빌드 및 AWS 클라우드 환경과 온프레미스 환경에 자동 배포하는 등의 CI/CD를 직접 구축했습니다.\",\"en\":\"I took part in developing every product at the company — the internal admin, commerce, and product collection systems among them — and owned the architecture design from the ground up on several of them.\\n\\nI was also involved in operating everything I built: running databases efficiently and reliably under cost constraints, and setting up CI/CD myself, including automated builds and automated deployment to both AWS cloud and on-premise environments.\"},\"techs\":[\"TypeScript\",\"Node.js\",\"NestJS\",\"MySQL\",\"AuroraDB\",\"Redis\",\"RabbitMQ\",\"AWS\"]},{\"company\":{\"ko\":\"피플펀드컴퍼니\",\"en\":\"PeopleFund Company\"},\"companyNote\":{\"ko\":\"현. 피에프씨테크놀로지스\",\"en\":\"Now PFC Technologies\"},\"companyLogo\":{\"src\":\"teams/peoplefund_white.png\",\"srcOnLight\":\"teams/peoplefund.png\",\"padding\":12},\"title\":{\"ko\":\"백엔드 엔지니어 (현장실습)\",\"en\":\"Back-end Engineer (Internship)\"},\"startedAt\":\"2020-01\",\"finishedAt\":\"2020-02\",\"location\":{\"ko\":\"서울특별시 강남구\",\"en\":\"Gangnam-gu, Seoul\"},\"link\":\"https://www.pfct.co.kr/\",\"summary\":{\"ko\":\"고등학교 2학년 겨울방학에 현장실습으로 1개월간 근무했습니다. 계정 인증 미들웨어를 개선했고 일부 기능 리팩토링을 진행했습니다.\",\"en\":\"Worked as a field trainee for one month during winter break of my second year of high school. Improved the account authentication middleware and refactored related features.\"},\"techs\":[\"Python\",\"Django\"]}],\"links\":[{\"type\":\"메일\",\"link\":\"mailto:me@startergate.dev\",\"external_id\":\"me@startergate.dev\"},{\"type\":\"LinkedIn\",\"link\":\"https://www.linkedin.com/in/호승-최-bb9a2aba/\",\"external_id\":\"최호승\"},{\"type\":\"Rocketpunch\",\"link\":\"https://www.rocketpunch.com/@startergate\",\"external_id\":\"@startergate\"},{\"type\":\"GitHub\",\"link\":\"https://github.com/startergate\",\"external_id\":\"startergate\"},{\"type\":\"StackShare\",\"link\":\"https://stackshare.io/startergate\",\"external_id\":\"startergate\"},{\"type\":\"npm\",\"link\":\"https://www.npmjs.com/~startergate\",\"external_id\":\"~startergate\"},{\"type\":\"Docker Hub\",\"link\":\"https://hub.docker.com/u/startergate\",\"external_id\":\"startergate\"}]}]}]\n10:I[79520,[\"/_next/static/chunks/096c48iz9u096.js\"],\"\"]\n11:I[93400,[\"/_next/static/chunks/096c48iz9u096.js\"],\"ThemeProvider\"]\n12:I[93115,[\"/_next/static/chunks/096c48iz9u096.js\"],\"LangProvider\"]\n4:[\"$\",\"html\",null,{\"lang\":\"en\",\"className\":\"inter_8a594245-module__h1XLeG__variable jetbr
